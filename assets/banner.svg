<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(148, 163, 184, 0.07); stroke-width: 1; }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .stream-particle {
        animation: streamMove 8s linear infinite;
      }
      .stream-particle-rev {
        animation: streamMoveRev 10s linear infinite;
      }
      .pill-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: float2 5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.25; }
        100% { transform: scale(1.1); opacity: 0.45; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes streamMove {
        0% { transform: translateX(0px); }
        100% { transform: translateX(500px); }
      }
      @keyframes streamMoveRev {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-400px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Animated Ambient Glows (strictly background layer) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="pulse-circle" opacity="0.15" />
  <circle cx="1000" cy="240" r="160" fill="#a855f7" filter="url(#glow)" class="pulse-circle" opacity="0.15" style="animation-delay: -2s;" />

  <!-- Background Grid Pattern -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="500" y1="0" x2="500" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="700" y1="0" x2="700" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
    <line x1="1100" y1="0" x2="1100" y2="340" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Flow Data Streams (Background dynamics) -->
  <g opacity="0.3">
    <!-- Stream Line 1 -->
    <path d="M 50 280 C 300 240, 500 320, 800 270 S 1100 290, 1150 260" fill="none" stroke="url(#accent-cyan)" stroke-width="2" stroke-dasharray="6,8"/>
    <!-- Stream Line 2 -->
    <path d="M 50 60 C 250 110, 600 40, 850 80 S 1100 50, 1150 90" fill="none" stroke="url(#accent-purple)" stroke-width="2" stroke-dasharray="4,6"/>
  </g>

  <!-- Background Data Flow Particles (Dynamic Elements) -->
  <g opacity="0.5">
    <circle cx="200" cy="275" r="3" fill="#38bdf8" class="stream-particle" />
    <circle cx="450" cy="295" r="4" fill="#38bdf8" class="stream-particle" />
    <circle cx="700" cy="272" r="3" fill="#38bdf8" class="stream-particle" />
    <circle cx="950" cy="70" r="3.5" fill="#c084fc" class="stream-particle-rev" />
    <circle cx="650" cy="55" r="4" fill="#c084fc" class="stream-particle-rev" />
  </g>

  <!-- Dynamic Badges / Pills (Placed gracefully on the perimeter so foreground text stays 100% unobstructed) -->
  <g class="pill-float" transform="translate(900, 45)">
    <rect width="170" height="32" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="20" cy="16" r="4" fill="#38bdf8"/>
    <text x="32" y="20" fill="#e2e8f0" class="badge-label">STREAMING PARSERS</text>
  </g>

  <g class="pill-float-2" transform="translate(930, 100)">
    <rect width="180" height="32" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="20" cy="16" r="4" fill="#a855f7"/>
    <text x="32" y="20" fill="#e2e8f0" class="badge-label">RFC 4180 COMPLIANCE</text>
  </g>

  <g class="pill-float" transform="translate(870, 155)">
    <rect width="180" height="32" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="20" cy="16" r="4" fill="#34d399"/>
    <text x="32" y="20" fill="#e2e8f0" class="badge-label">DATAFRAME ENGINES</text>
  </g>

  <g class="pill-float-2" transform="translate(910, 210)">
    <rect width="190" height="32" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="20" cy="16" r="4" fill="#f59e0b"/>
    <text x="32" y="20" fill="#e2e8f0" class="badge-label">ENTERPRISE SAAS ETL</text>
  </g>

  <!-- FOREGROUND BRANDING & TITLE (Completely visible, clean and high-contrast) -->
  <g transform="translate(80, 80)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="56" height="56" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Table Grid Icon -->
    <path d="M 14 18 L 42 18 L 42 38 L 14 38 Z M 14 26 L 42 26 M 28 18 L 28 38" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Category Tag -->
    <text x="70" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">CURATED ECOSYSTEM &amp; BENCHMARKS</text>

    <!-- Main Title -->
    <text x="70" y="58" class="title-text">Awesome CSV &amp; Tabular Parsers</text>

    <!-- Subtitle -->
    <text x="70" y="96" class="subtitle-text">High-Throughput Delimiter-Separated Parsers, SIMD Decoders &amp; Cloud Data Importers</text>

    <!-- Language / Architecture Pills -->
    <g transform="translate(70, 125)">
      <!-- Rust -->
      <rect x="0" y="0" width="70" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="35" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Rust</text>

      <!-- Python -->
      <rect x="78" y="0" width="80" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="118" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Python</text>

      <!-- TypeScript / Node -->
      <rect x="166" y="0" width="95" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="213" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">TypeScript</text>

      <!-- Java / .NET -->
      <rect x="269" y="0" width="85" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="311" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Java / .NET</text>

      <!-- Cloud SaaS -->
      <rect x="362" y="0" width="95" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="409" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Cloud SaaS</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect width="100%" height="100%" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
</svg>
